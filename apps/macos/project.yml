name: Bunyi
options:
  bundleIdPrefix: app.bunyi
  deploymentTarget:
    macOS: "15.0"
packages:
  swift-qwen3-tts:
    url: https://github.com/AtomGradient/swift-qwen3-tts.git
    branch: main
targets:
  Bunyi:
    type: application
    platform: macOS
    sources:
      - Assets.xcassets
      - BunyiApp.swift
      - ContentView.swift
      - TTSEngine.swift
      - LogStore.swift
      - LogsView.swift
      - HistoryView.swift
      - HTTPFileDownloader.swift
      - DownloadedModels.swift
      - ModelConfigLibrary.swift
      - OutputMetadata.swift
      - ModelSettings.swift
      - SettingsView.swift
      - BackupManager.swift
      - ReferenceTranscriber.swift
      - VoiceLibrary.swift
      - WindowCloseGuard.swift
    dependencies:
      - package: swift-qwen3-tts
        product: Qwen3TTS
    entitlements:
      path: Bunyi.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # On-device transcription of reference clips (voice cloning).
        com.apple.security.device.speech-recognition: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bunyi
        LSApplicationCategoryType: public.app-category.utilities
        # The copyright line in the standard About panel. The panel itself is
        # left alone deliberately — AppKit already fills in the name, icon, and
        # version from this plist, and a hand-built one would only drift.
        NSHumanReadableCopyright: Copyright 2026 Shazron Abdullah and Bunyi contributors
        # Without these, XcodeGen writes a literal 1.0 / 1 and the build
        # settings below are ignored — so the app shipped as 1.0 no matter
        # what MARKETING_VERSION said, and release.yml's tag check compared
        # a bumped tag against a version that never moved.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSpeechRecognitionUsageDescription: >-
          Used to transcribe your reference clip on-device so voice cloning
          can match the spoken words to the audio.
        # Help Viewer resolves a book by folder and identifier. Both must match
        # what tools/packaging/make-help.sh builds, or Help opens blank.
        CFBundleHelpBookFolder: Bunyi.help
        CFBundleHelpBookName: app.bunyi.help
    postBuildScripts:
      # Generates Bunyi.help from HELP.md into the bundle Xcode just produced,
      # so ⌘R and build-dist.sh both ship help without a separate step.
      - name: Build the help book
        script: "\"$PROJECT_DIR/tools/packaging/make-help.sh\" \"$TARGET_BUILD_DIR/$WRAPPER_NAME\""
        basedOnDependencyAnalysis: false
    settings:
      base:
        # MLX only runs on Apple Silicon — never build an Intel slice.
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without this the AccentColor colorset is inert and Color.accentColor
        # falls back to whatever accent the *user* has set in System Settings —
        # so Generate, the playback bar, History's progress ring and every
        # focus ring rendered in someone else's blue, and two people running
        # Bunyi saw different apps. The colorset carries the same indigo the
        # app icon and bunyi.app are built from.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: Bunyi
        # Changed from the original com.geppettoforge.Qwen3TTSStudio. The
        # sandbox container is keyed to this, so an existing install gets a
        # NEW, empty container: settings, saved voices, and every downloaded
        # model are left behind in the old one. A sandboxed app cannot read
        # another app's container, so this cannot be migrated in code — see
        # AGENTS.md for what to tell anyone who had the old build.
        PRODUCT_BUNDLE_IDENTIFIER: app.bunyi.Bunyi
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Bunyi:
    build:
      targets:
        Bunyi: all
    run:
      config: Debug
