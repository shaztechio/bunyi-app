name: Bunyi
options:
  bundleIdPrefix: com.geppettoforge
  deploymentTarget:
    macOS: "15.0"
packages:
  swift-qwen3-tts:
    url: https://github.com/AtomGradient/swift-qwen3-tts.git
    branch: main
targets:
  Bunyi:
    type: application
    platform: macOS
    sources:
      - Assets.xcassets
      - BunyiApp.swift
      - ContentView.swift
      - TTSEngine.swift
      - LogStore.swift
      - LogsView.swift
      - ModelSettings.swift
      - SettingsView.swift
      - BackupManager.swift
      - ReferenceTranscriber.swift
      - VoiceLibrary.swift
      - WindowCloseGuard.swift
    dependencies:
      - package: swift-qwen3-tts
        product: Qwen3TTS
    entitlements:
      path: Bunyi.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # On-device transcription of reference clips (voice cloning).
        com.apple.security.device.speech-recognition: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bunyi
        LSApplicationCategoryType: public.app-category.utilities
        NSSpeechRecognitionUsageDescription: >-
          Used to transcribe your reference clip on-device so voice cloning
          can match the spoken words to the audio.
    settings:
      base:
        # MLX only runs on Apple Silicon — never build an Intel slice.
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Bunyi
        # Legacy bundle ID from the app's original name (Qwen3 TTS Studio).
        # Intentionally kept: the sandbox container, UserDefaults, saved
        # voices, and the downloaded multi-GB models are all keyed to it.
        PRODUCT_BUNDLE_IDENTIFIER: com.geppettoforge.Qwen3TTSStudio
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Bunyi:
    build:
      targets:
        Bunyi: all
    run:
      config: Debug
