name: Bunyi
options:
  bundleIdPrefix: app.bunyi
  deploymentTarget:
    macOS: "15.0"
packages:
  swift-qwen3-tts:
    url: https://github.com/shaztechio/swift-qwen3-tts.git
    revision: c0806fbf383fbfdc4a3ad2945f31d7087dcc477d
  whisper-spm:
    url: https://github.com/ggerganov/whisper.spm.git
    revision: a2085436c2eb796af90956b62bd64731f5e5b823
targets:
  BunyiMLXCore:
    type: framework
    platform: macOS
    sources:
      - CLISettingsStore.swift
      - MLXTtsRuntime.swift
      - TTSEngine.swift
      - LogStore.swift
      - PrivacyRedactor.swift
      - HTTPFileDownloader.swift
      - ModelFileTransfer.swift
      - ModelDownloadProgress.swift
      - SpeechSections.swift
      - DownloadedModels.swift
      - GeneratedOutput.swift
      - OutputMetadata.swift
      - OutputLevel.swift
      - ModelSettings.swift
      - ModelOperationLease.swift
      - ReferenceClipPolicy.swift
      - ReferenceTranscriber.swift
      - LocalWhisperTranscriber.swift
      - WhisperModelStore.swift
      - SavedVoice.swift
      - VoiceLibrary.swift
      - ModelsFolderBookmarkStore.swift
      - Doctor.swift
      - BackupFileTree.swift
      - BackupManager.swift
    dependencies:
      - package: swift-qwen3-tts
        product: Qwen3TTS
      - package: whisper-spm
        product: whisper
    settings:
      base:
        ARCHS: arm64
        PRODUCT_MODULE_NAME: BunyiMLXCore
        PRODUCT_BUNDLE_IDENTIFIER: app.bunyi.BunyiMLXCore
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  BunyiCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
    dependencies:
      - target: BunyiMLXCore
      - package: whisper-spm
        product: whisper
    info:
      path: BunyiCLI-Info.plist
      properties:
        CFBundleDisplayName: bunyi
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        ARCHS: arm64
        PRODUCT_NAME: bunyi
        PRODUCT_BUNDLE_IDENTIFIER: app.bunyi.cli
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        # The sibling path runs the raw Xcode product in CI; the Frameworks
        # path is the layout in the self-contained release archive.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path @executable_path/Frameworks"
  Bunyi:
    type: application
    platform: macOS
    sources:
      - Assets.xcassets
      - path: ../../spec/CREDITS.json
        buildPhase: resources
      - BunyiApp.swift
      - AboutCredits.swift
      - ContentView.swift
      - AccessibilityAnnouncementCenter.swift
      - AccessibilityAnnouncementPacer.swift
      - StartupTimeline.swift
      - LogsView.swift
      - HistoryView.swift
      - DownloadProgressView.swift
      - DoctorView.swift
      - ModelConfigLibrary.swift
      - SettingsView.swift
      - WindowCloseGuard.swift
      - Theme.swift
    dependencies:
      - target: BunyiMLXCore
    entitlements:
      path: Bunyi.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # On-device transcription of reference clips (voice cloning).
        com.apple.security.device.speech-recognition: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bunyi
        LSApplicationCategoryType: public.app-category.utilities
        # The copyright line in the standard About panel. BunyiApp supplies its
        # platform/version and the shared spec/CREDITS.json content.
        NSHumanReadableCopyright: Copyright 2026 Shazron Abdullah and Bunyi contributors
        # Without these, XcodeGen writes a literal 1.0 / 1 and the build
        # settings below are ignored — so the app shipped as 1.0 no matter
        # what MARKETING_VERSION said, and release.yml's tag check compared
        # a bumped tag against a version that never moved.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSpeechRecognitionUsageDescription: >-
          Used to transcribe your reference clip on-device so voice cloning
          can match the spoken words to the audio.
        # Help Viewer resolves a book by folder and identifier. Both must match
        # what tools/packaging/make-help.sh builds, or Help opens blank.
        CFBundleHelpBookFolder: Bunyi.help
        CFBundleHelpBookName: app.bunyi.help
    postBuildScripts:
      # Generates Bunyi.help from HELP.md into the bundle Xcode just produced,
      # so ⌘R and build-dist.sh both ship help without a separate step.
      - name: Build the help book
        script: "\"$PROJECT_DIR/tools/packaging/make-help.sh\" \"$TARGET_BUILD_DIR/$WRAPPER_NAME\""
        basedOnDependencyAnalysis: false
    settings:
      base:
        # MLX only runs on Apple Silicon — never build an Intel slice.
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without this the AccentColor colorset is inert and Color.accentColor
        # falls back to whatever accent the *user* has set in System Settings —
        # so Generate, the playback bar, History's progress ring and every
        # focus ring rendered in someone else's blue, and two people running
        # Bunyi saw different apps. The colorset carries the same indigo the
        # app icon and bunyi.app are built from.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: Bunyi
        # Changed from the original com.geppettoforge.Qwen3TTSStudio. The
        # sandbox container is keyed to this, so an existing install gets a
        # NEW, empty container: settings, saved voices, and every downloaded
        # model are left behind in the old one. A sandboxed app cannot read
        # another app's container, so this cannot be migrated in code — see
        # AGENTS.md for what to tell anyone who had the old build.
        PRODUCT_BUNDLE_IDENTIFIER: app.bunyi.Bunyi
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 4
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  BunyiCLI:
    build:
      targets:
        BunyiCLI: all
    run:
      config: Debug
  Bunyi:
    build:
      targets:
        Bunyi: all
    run:
      config: Debug
