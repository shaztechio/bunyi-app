name: .NET build (Windows + Linux)

# The Windows+Linux app (apps/dotnet) is a SCAFFOLD — this workflow will be
# red until it is implemented. It documents the intended build and turns
# green once the stubs are filled in against /spec/FEATURES.md.

on:
  push:
    branches: [main]
    paths: ["apps/dotnet/**", "spec/**", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["apps/dotnet/**", "spec/**", ".github/workflows/dotnet.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
