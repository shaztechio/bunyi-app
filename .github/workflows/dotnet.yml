name: .NET build (Windows + Linux)

# Builds and tests the Windows+Linux app on both operating systems. The app
# itself is still being filled in against /spec/FEATURES.md, but the build,
# the tests and both publish paths are green and expected to stay that way.
#
# The publish step is not decoration: apps/dotnet ships as self-contained
# builds, and a publish path that is never exercised is one that breaks
# quietly and is discovered at release time.

on:
  push:
    branches: [main]
    paths: ["apps/dotnet/**", "spec/**", ".github/workflows/dotnet.yml", ".github/workflows/dotnet-release.yml", ".github/workflows/linux-installer-check.yml"]
  pull_request:
    paths: ["apps/dotnet/**", "spec/**", ".github/workflows/dotnet.yml", ".github/workflows/dotnet-release.yml", ".github/workflows/linux-installer-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('apps/dotnet/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Test Store metadata reuse
        run: python -m unittest discover -s packaging -p 'test_*.py' -v

      # tools/UiaProbe is deliberately outside Bunyi.sln: it targets
      # net10.0-windows, so a solution build on Linux could not contain it.
      # Built here anyway, on the Windows runner, so it cannot rot — it is the
      # only thing that checks the accessibility work where a screen reader
      # consumes it (#192) and a tool that stops compiling stops being run.
      #
      # Built, not run. It reads the UI Automation tree of a live window and
      # needs a real desktop session, which a hosted runner does not have.
      - name: Build the UIA probe (Windows only)
        if: runner.os == 'Windows'
        run: dotnet build tools/UiaProbe -c Release

      # The AT-SPI host drives real status bindings without inference. Running
      # its Python probe needs a Linux desktop, so CI checks compilation only.
      - name: Build the AT-SPI diagnostic host (Linux only)
        if: runner.os == 'Linux'
        run: dotnet build tools/AtSpiProbe/Host -c Release

      # Also outside Bunyi.sln, and for the same reason: an operator's tool, not
      # part of the app. Cross-platform, so both runners build it. Built and not
      # run — it wants a models folder with 14 GB in it.
      - name: Build the mirror manifest tool
        run: dotnet build tools/MirrorManifest -c Release

      # src/Core is UI-framework-free by rule (see apps/dotnet/AGENTS.md).
      # Checked rather than trusted: the rule is easy to break by reflex, with
      # an editor's using-completion, and hard to notice in review.
      - name: Core stays UI-framework-free
        shell: bash
        run: |
          if grep -rnE '^\s*(global\s+)?using\s+Avalonia' src/Core/ ; then
            echo "::error::src/Core must not reference Avalonia — UI belongs in src/App."
            exit 1
          fi
          if grep -rn 'Include="Avalonia' src/Core/*.csproj ; then
            echo "::error::src/Core must not take an Avalonia package reference."
            exit 1
          fi
          echo "src/Core is clean."

      - name: Publish (self-contained)
        shell: bash
        run: |
          rid=$([ "$RUNNER_OS" = "Windows" ] && echo win-x64 || echo linux-x64)
          dotnet publish src/App -c Release -r "$rid" --self-contained -o "artifacts/$rid"

      - name: Verify packaged desktop defaults
        shell: pwsh
        run: |
          $rid = if ($IsWindows) { 'win-x64' } else { 'linux-x64' }
          ./packaging/test-defaults.ps1 -Path "artifacts/$rid"

      - name: Package Windows MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build-msix.ps1 -PublishDirectory artifacts/win-x64

      - name: Build and exercise Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/install-inno.ps1 -Destination "$env:RUNNER_TEMP/inno"
          ./packaging/windows/build-installer.ps1 -PublishDirectory artifacts/win-x64 -CompilerPath "$env:RUNNER_TEMP/inno/compiler/ISCC.exe"
          dotnet publish src/App -c Release -r win-x64 --self-contained -p:BunyiCuda=false -p:Version=0.0.1 -o artifacts/previous-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/windows/build-installer.ps1 -PublishDirectory artifacts/previous-win-x64 -Version 0.0.1 -OutputDirectory artifacts/installer-previous -CompilerPath "$env:RUNNER_TEMP/inno/compiler/ISCC.exe"
          $installer = (Get-ChildItem dist/*-setup.exe).FullName
          ./packaging/windows/test-installer.ps1 -Installer $installer -PreviousInstaller artifacts/installer-previous/Bunyi-0.0.1-win-x64-setup.exe

      - name: Build and exercise Windows CUDA installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/App -c Release -r win-x64 --self-contained -p:BunyiCuda=true -o artifacts/win-x64-cuda
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/windows/build-installer.ps1 -PublishDirectory artifacts/win-x64-cuda -Cuda -CompilerPath "$env:RUNNER_TEMP/inno/compiler/ISCC.exe"
          $cudaInstaller = (Get-ChildItem dist/*-cuda-setup.exe).FullName
          $cpuInstaller = (Get-ChildItem dist/*-setup.exe | Where-Object Name -notlike '*-cuda-setup.exe').FullName
          ./packaging/windows/test-installer.ps1 -Installer $cudaInstaller -Cuda -AlternativeInstaller $cpuInstaller -PreviousInstaller artifacts/installer-previous/Bunyi-0.0.1-win-x64-setup.exe

      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          python3 packaging/linux/build-packages.py --publish-directory artifacts/linux-x64
          dotnet publish src/App -c Release -r linux-x64 --self-contained -p:BunyiCuda=false -p:Version=0.0.1 -o artifacts/previous-linux-x64
          python3 packaging/linux/build-packages.py --publish-directory artifacts/previous-linux-x64 --version 0.0.1 --output artifacts/installer-previous

      - name: Upload Linux upgrade fixture
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installers-Linux-previous
          path: apps/dotnet/artifacts/installer-previous/*
          if-no-files-found: error

      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installers-${{ runner.os }}
          path: apps/dotnet/dist/*
          if-no-files-found: error

      - name: Publish and exercise the standalone CLI
        shell: pwsh
        run: |
          $rid = if ($IsWindows) { 'win-x64' } else { 'linux-x64' }
          foreach ($cuda in @('false', 'true')) {
            $suffix = if ($cuda -eq 'true') { '-cuda' } else { '' }
            $folder = "artifacts/cli-$rid$suffix"
            dotnet publish src/Cli -c Release -r $rid --self-contained "-p:BunyiCuda=$cuda" -o $folder
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./packaging/test-cli.ps1 -PublishDirectory $folder
          }

      - name: Upload unsigned Store package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-store-msix
          path: |
            apps/dotnet/artifacts/msix/*.msix
            apps/dotnet/artifacts/msix/*.sha256
          if-no-files-found: error

      # Whisper.net.Runtime offers its natives for every platform at once, and
      # a publish will happily copy all of them — about 15 MB nobody can load.
      # Directory.Build.targets drops the ones that do not match the RID; this
      # checks it still does, in both directions. Getting it wrong the other way
      # is worse than the waste: a build that cannot transcribe at all.
      - name: The build carries only its own Whisper natives
        shell: bash
        run: |
          rid=$([ "$RUNNER_OS" = "Windows" ] && echo win-x64 || echo linux-x64)
          cd "artifacts/$rid"

          foreign=$(find runtimes -iname "*whisper*" -not -path "runtimes/$rid/*" 2>/dev/null || true)
          if [ -n "$foreign" ]; then
            echo "::error::natives for other platforms are being shipped:"
            echo "$foreign"
            exit 1
          fi

          if [ -z "$(find runtimes/$rid -iname '*whisper*' 2>/dev/null)" ]; then
            echo "::error::no Whisper natives for $rid — transcription cannot work."
            exit 1
          fi

          if [ -e ggml-metal.metal ]; then
            echo "::error::an Apple Metal shader is being shipped to $rid."
            exit 1
          fi

          echo "Only $rid Whisper natives present."

  linux-installers:
    needs: build
    uses: ./.github/workflows/linux-installer-check.yml
    with:
      artifact: desktop-installers-Linux
      previous-artifact: desktop-installers-Linux-previous
