name: macOS build

# Safe on pull requests, unlike release.yml: this needs no secrets, so a branch
# cannot use it to reach the signing certificate.
on:
  push:
    branches: [main]
    paths: ["apps/macos/**", "spec/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["apps/macos/**", "spec/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

# Read-only. Nothing here writes to the repository, and saying so means a token
# leak from a build step cannot push.
permissions:
  contents: read

# A new push supersedes the previous run for the same branch. Release builds are
# deliberately excluded from this pattern — see release.yml, where cancelling a
# half-finished notarization would be worse than waiting.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # MLX compiles a large amount of C++ and Metal from source on a cold cache.
    timeout-minutes: 90
    # Xcode 26 required: the app uses Swift 6.2 features and mlx-swift's
    # Metal Toolchain. It does NOT build on the macos-15 image (Xcode 16.4).
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Metal Toolchain (Xcode 26 needs it for mlx-swift shaders)
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Generate project
        run: xcodegen generate
      - name: Check measured download feedback
        run: |
          swiftc -parse-as-library ModelDownloadProgress.swift HTTPFileDownloader.swift ModelFileTransfer.swift tests/DownloadProgressChecks.swift tests/ModelFileTransferChecks.swift -o /tmp/bunyi-download-checks
          python3 tests/check-model-transfer.py /tmp/bunyi-download-checks
      - name: Check output level protection
        run: |
          swiftc -parse-as-library OutputLevel.swift tests/OutputLevelChecks.swift -o /tmp/bunyi-output-level-checks
          /tmp/bunyi-output-level-checks
      - name: Check privacy redaction
        run: |
          swiftc -parse-as-library PrivacyRedactor.swift tests/PrivacyRedactorChecks.swift -o /tmp/bunyi-privacy-redactor-checks
          /tmp/bunyi-privacy-redactor-checks
      - name: Check voice-clone reference alignment
        run: |
          swiftc -parse-as-library ReferenceClipPolicy.swift tests/ReferenceClipPolicyChecks.swift -o /tmp/bunyi-reference-clip-checks
          /tmp/bunyi-reference-clip-checks
      - name: Check saved-voice data format
        run: |
          swiftc -parse-as-library SavedVoice.swift tests/SavedVoiceFormatChecks.swift -o /tmp/bunyi-saved-voice-checks
          /tmp/bunyi-saved-voice-checks
      - name: Check models-folder bookmark migration
        run: |
          swiftc -parse-as-library ModelsFolderBookmarkStore.swift tests/ModelsFolderBookmarkChecks.swift -o /tmp/bunyi-models-folder-checks
          /tmp/bunyi-models-folder-checks
      - name: Check WAV output metadata
        run: |
          swiftc -parse-as-library OutputMetadata.swift tests/OutputMetadataChecks.swift -o /tmp/bunyi-output-metadata-checks
          /tmp/bunyi-output-metadata-checks
      - name: Check cancellable custom-folder backup copy
        run: |
          swiftc -parse-as-library BackupFileTree.swift tests/BackupFileTreeChecks.swift -o /tmp/bunyi-backup-tree-checks
          /tmp/bunyi-backup-tree-checks
      - name: Check accessibility announcement pacing
        run: |
          swiftc -parse-as-library AccessibilityAnnouncementPacer.swift tests/AccessibilityAnnouncementPacerChecks.swift -o /tmp/bunyi-accessibility-announcement-checks
          /tmp/bunyi-accessibility-announcement-checks
      - name: Check long-text sections
        run: |
          swiftc -parse-as-library SpeechSections.swift tests/SpeechSectionsChecks.swift -o /tmp/bunyi-speech-section-checks
          /tmp/bunyi-speech-section-checks
      - name: Check CLI contract
        run: |
          swiftc -parse-as-library CLI/CLIProtocol.swift CLI/CLICommandParser.swift tests/CLIContractChecks.swift -o /tmp/bunyi-cli-contract-checks
          /tmp/bunyi-cli-contract-checks
      - name: Check CLI packaging scripts
        run: |
          zsh -n build-cli-dist.sh
          bash -n tools/packaging/sign-and-notarize-cli.sh
      - name: Check cross-process model lease
        run: |
          swiftc -parse-as-library ModelOperationLease.swift tests/ModelOperationLeaseChecks.swift -o /tmp/bunyi-lease-checks
          /tmp/bunyi-lease-checks
      - name: Build app
        run: |
          xcodebuild -project Bunyi.xcodeproj \
            -scheme "Bunyi" \
            -destination 'platform=macOS' build
      - name: Build CLI preview
        run: |
          xcodebuild -project Bunyi.xcodeproj \
            -scheme "BunyiCLI" \
            -destination 'platform=macOS' build
      - name: Check bounded CLI command surface
        run: |
          set -euo pipefail
          CLI_BUILD_DIR="$(xcodebuild -project Bunyi.xcodeproj -scheme BunyiCLI -showBuildSettings | sed -n 's/^[[:space:]]*TARGET_BUILD_DIR = //p' | head -1)"
          CLI_BIN="$CLI_BUILD_DIR/bunyi"
          python3 - "$CLI_BIN" <<'PY'
          import json, subprocess, sys
          cli = sys.argv[1]
          commands = [
              ["version", "--json"],
              ["config", "list", "--json", "--one-shot"],
              ["voices", "list", "--json", "--one-shot"],
              ["history", "list", "--json", "--one-shot"],
              ["logs", "path", "--json", "--one-shot"],
              ["logs", "tail", "--lines", "5", "--json", "--one-shot"],
          ]
          for command in commands:
              completed = subprocess.run(
                  [cli, *command], check=True, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              lines = completed.stdout.splitlines()
              assert len(lines) == 1, (command, completed.stdout)
              value = json.loads(lines[0])
              assert value["schemaVersion"] == 1 and value["ok"] is True
              assert value["type"] == "result" and value["operationId"]
          PY
      - name: Check CLI server lifecycle
        run: |
          set -euo pipefail
          CLI_BUILD_DIR="$(xcodebuild -project Bunyi.xcodeproj -scheme BunyiCLI -showBuildSettings | sed -n 's/^[[:space:]]*TARGET_BUILD_DIR = //p' | head -1)"
          CLI_BIN="$CLI_BUILD_DIR/bunyi"
          SERVER_SCOPE="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SERVER_STREAM="$RUNNER_TEMP/bunyi-server.jsonl"
          STATUS_JSON="$RUNNER_TEMP/bunyi-server-status.json"
          FOLLOW_STREAM="$RUNNER_TEMP/bunyi-job-follow.jsonl"
          cleanup() {
            env BUNYI_SERVER_SCOPE="$SERVER_SCOPE" "$CLI_BIN" server stop --json >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          env BUNYI_SERVER_SCOPE="$SERVER_SCOPE" "$CLI_BIN" server run --jsonl >"$SERVER_STREAM" &
          SERVER_PID=$!
          for ATTEMPT in {1..100}; do
            if env BUNYI_SERVER_SCOPE="$SERVER_SCOPE" "$CLI_BIN" server status --json >"$STATUS_JSON" 2>/dev/null; then
              break
            fi
            sleep 0.05
          done
          kill -0 "$SERVER_PID"
          python3 - "$STATUS_JSON" <<'PY'
          import json, os, stat, sys
          status = json.load(open(sys.argv[1]))
          assert status["protocolVersion"] == 1
          assert status["loadedMode"] is None
          socket_path = status["socketPath"]
          assert stat.S_ISSOCK(os.stat(socket_path).st_mode)
          assert stat.S_IMODE(os.stat(socket_path).st_mode) == 0o600
          assert stat.S_IMODE(os.stat(os.path.dirname(socket_path)).st_mode) == 0o700
          PY
          if lsof -nP -a -p "$SERVER_PID" -iTCP | grep -q .; then
            echo "Bunyi server unexpectedly opened a TCP listener" >&2
            exit 1
          fi

          START_JSON="$(env BUNYI_SERVER_SCOPE="$SERVER_SCOPE" "$CLI_BIN" server start --json)"
          python3 -c 'import json,sys; assert json.load(sys.stdin)["alreadyRunning"] is True' <<<"$START_JSON"
          set +e
          SECOND_RUN="$(env BUNYI_SERVER_SCOPE="$SERVER_SCOPE" "$CLI_BIN" server run --json)"
          SECOND_CODE=$?
          set -e
          test "$SECOND_CODE" -eq 4
          python3 -c 'import json,sys; assert json.load(sys.stdin)["error"]["code"] == "bunyi_busy"' <<<"$SECOND_RUN"

          JOB_JSON="$(env BUNYI_SERVER_SCOPE="$SERVER_SCOPE" "$CLI_BIN" server unload --detach --json)"
          JOB_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["operationId"])' <<<"$JOB_JSON")"
          env BUNYI_SERVER_SCOPE="$SERVER_SCOPE" "$CLI_BIN" jobs status "$JOB_ID" --json >/dev/null
          env BUNYI_SERVER_SCOPE="$SERVER_SCOPE" "$CLI_BIN" jobs follow "$JOB_ID" --jsonl >"$FOLLOW_STREAM"
          python3 - "$FOLLOW_STREAM" <<'PY'
          import json, sys
          lines = [json.loads(line) for line in open(sys.argv[1])]
          assert lines[-1]["type"] == "result"
          assert lines[-1]["operationId"]
          PY

          env BUNYI_SERVER_SCOPE="$SERVER_SCOPE" "$CLI_BIN" server stop --json >/dev/null
          wait "$SERVER_PID"
          trap - EXIT
          python3 - "$SERVER_STREAM" <<'PY'
          import json, sys
          lines = [json.loads(line) for line in open(sys.argv[1])]
          assert lines[0]["type"] == "ready"
          assert lines[-1]["type"] == "result"
          assert lines[-1]["stopped"] is True
          PY

          SIGNAL_STREAM="$RUNNER_TEMP/bunyi-server-signal.jsonl"
          env BUNYI_SERVER_SCOPE="$SERVER_SCOPE-signal" "$CLI_BIN" server run --jsonl >"$SIGNAL_STREAM" &
          SIGNAL_PID=$!
          for ATTEMPT in {1..100}; do
            if env BUNYI_SERVER_SCOPE="$SERVER_SCOPE-signal" "$CLI_BIN" server status --json >/dev/null 2>&1; then
              break
            fi
            sleep 0.05
          done
          kill -INT "$SIGNAL_PID"
          wait "$SIGNAL_PID"
          python3 - "$SIGNAL_STREAM" <<'PY'
          import json, sys
          lines = [json.loads(line) for line in open(sys.argv[1])]
          assert lines[0]["type"] == "ready"
          assert lines[-1]["type"] == "result"
          assert lines[-1]["stopped"] is True
          PY
