name: Windows + Linux release

# Its own tag namespace, because the two apps release separately and are not
# expected to march in step — apps/dotnet/Directory.Build.props says so, and
# macOS already owns `v*`. A `dotnet-v*` tag does not match `v*`, so cutting one
# here cannot start a signed macOS release.
on:
  push:
    tags: ['dotnet-v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Cut a release? "none" builds without publishing.'
        type: choice
        default: none
        options: [none, patch, minor, major]
      version:
        description: 'Exact version x.y.z. Overrides the bump choice.'
        type: string
        default: ''

# Needed to create the Release and to push the version bump when one is cut
# from the browser. Signing credentials are confined to the windows-sign job;
# there is deliberately no pull_request trigger for this release workflow.
permissions:
  contents: write

concurrency:
  group: dotnet-release
  cancel-in-progress: false

jobs:
  # Deciding the version once, before anything is built, so both platforms
  # stamp the same number and the tag cannot disagree with the binaries.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          # Release notes read the commits since the previous tag, so a shallow
          # clone would produce an empty changelog.
          fetch-depth: 0

      - name: Decide the version
        id: pick
        run: |
          set -euo pipefail
          props="apps/dotnet/Directory.Build.props"
          current="$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' "$props" | head -1)"

          if [ "${{ github.event_name }}" = "push" ]; then
            # The tag is the authority on a tag-triggered run.
            version="${GITHUB_REF_NAME#dotnet-v}"
            echo "publish=true" >> "$GITHUB_OUTPUT"

            if [ "$version" != "$current" ]; then
              echo "Tag $GITHUB_REF_NAME does not match VersionPrefix $current in $props." >&2
              echo "Bump the file and tag the commit that changed it." >&2
              exit 1
            fi
          elif [ -n "${{ inputs.version }}" ] || [ "${{ inputs.bump }}" != "none" ]; then
            requested="${{ inputs.version }}"
            if [ -n "$requested" ]; then
              version="${requested#v}"
            else
              major="${current%%.*}"; rest="${current#*.}"
              minor="${rest%%.*}"; patch="${rest#*.}"
              case "${{ inputs.bump }}" in
                patch) version="$major.$minor.$((patch + 1))" ;;
                minor) version="$major.$((minor + 1)).0" ;;
                major) version="$((major + 1)).0.0" ;;
              esac
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # A dry run: build everything, publish nothing.
            version="$current"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "$version is not a valid x.y.z version" >&2; exit 1 ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=dotnet-v$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # Only when the run started from the browser: a tag-triggered run is
      # already sitting on the commit that carries the version.
      - name: Bump the version and tag
        if: github.event_name == 'workflow_dispatch' && steps.pick.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.pick.outputs.version }}"
          tag="${{ steps.pick.outputs.tag }}"
          props="apps/dotnet/Directory.Build.props"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          sed -i "s|<VersionPrefix>.*</VersionPrefix>|<VersionPrefix>$version</VersionPrefix>|" "$props"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Asking for the version the file already carries is reasonable — it is
          # what cutting the very first release looks like — and `git commit`
          # fails on an empty change, which under set -e took the whole step
          # with it. Nothing to commit simply means the tag goes on this commit.
          if git diff --quiet -- "$props"; then
            echo "VersionPrefix is already $version; tagging this commit."
          else
            git add "$props"
            git commit -m "chore(dotnet): release $version"
          fi

          git tag "$tag"

          # Pushing with GITHUB_TOKEN raises no workflow events, so this does
          # not start a second run of this file.
          git push origin HEAD:"${GITHUB_REF_NAME}" "$tag"

  build:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Four builds, two of each platform. The `-cuda` pair carries ONNX
        # Runtime's GPU package; see Bunyi.Core.csproj for why it is a separate
        # download rather than the only one.
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
            cuda: false
            suffix: ''
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            cuda: false
            suffix: ''
          - os: windows-latest
            rid: win-x64
            archive: zip
            cuda: true
            suffix: '-cuda'
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            cuda: true
            suffix: '-cuda'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      # The tag when there is one — the bump commit may have landed a moment
      # ago, and building anything but the tagged tree would ship binaries the
      # tag does not describe.
      - uses: actions/checkout@v7
        if: needs.version.outputs.publish == 'true'
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      # A dry run has no tag to check out.
      - uses: actions/checkout@v7
        if: needs.version.outputs.publish == 'false'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The tests are not the release gate — dotnet.yml already runs them on
      # every pull request — but a release built from a tree that cannot pass
      # them is not one worth publishing.
      - name: Test
        working-directory: apps/dotnet
        run: dotnet test -c Release

      - name: Publish
        working-directory: apps/dotnet
        run: >
          dotnet publish src/App -c Release -r ${{ matrix.rid }} --self-contained
          -p:Version=${{ needs.version.outputs.version }}
          -p:BunyiCuda=${{ matrix.cuda }}
          -o publish/${{ matrix.rid }}

      - name: Verify desktop defaults
        shell: pwsh
        working-directory: apps/dotnet
        run: ./packaging/test-defaults.ps1 -Path publish/${{ matrix.rid }}

      - name: Build Linux installers
        if: matrix.rid == 'linux-x64' && matrix.cuda == false
        working-directory: apps/dotnet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          python3 packaging/linux/build-packages.py --publish-directory publish/linux-x64

      - name: Prepare unsigned MSIX
        if: matrix.rid == 'win-x64' && matrix.cuda == false
        shell: pwsh
        working-directory: apps/dotnet
        run: ./packaging/windows/build-msix.ps1 -PublishDirectory publish/win-x64

      - name: Upload MSIX for submission testing
        if: matrix.rid == 'win-x64' && matrix.cuda == false
        uses: actions/upload-artifact@v7
        with:
          name: Bunyi-MSIX-${{ needs.version.outputs.version }}
          path: |
            apps/dotnet/artifacts/msix/*.msix
            apps/dotnet/artifacts/msix/*.sha256
          if-no-files-found: error

      - name: Publish CLI
        working-directory: apps/dotnet
        run: >
          dotnet publish src/Cli -c Release -r ${{ matrix.rid }} --self-contained
          -p:Version=${{ needs.version.outputs.version }}
          -p:BunyiCuda=${{ matrix.cuda }}
          -o publish/cli-${{ matrix.rid }}

      - name: Test CLI distribution
        shell: pwsh
        working-directory: apps/dotnet
        run: ./packaging/test-cli.ps1 -PublishDirectory publish/cli-${{ matrix.rid }}

      # These are intermediate artifacts, never direct release downloads.
      - name: Upload Windows payloads for signing
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: windows-payload${{ matrix.suffix }}
          path: apps/dotnet/publish/
          if-no-files-found: error
          retention-days: 1

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        working-directory: apps/dotnet
        run: |
          set -euo pipefail
          name="Bunyi-${{ needs.version.outputs.version }}-${{ matrix.rid }}${{ matrix.suffix }}"
          mkdir -p dist
          # The executable bit does not survive a zip on Linux, which is half of
          # why this one is a tarball.
          chmod +x "publish/${{ matrix.rid }}/Bunyi.App"
          tar -czf "dist/$name.tar.gz" -C "publish/${{ matrix.rid }}" .
          mkdir -p publish/app-extracted
          tar -xzf "dist/$name.tar.gz" -C publish/app-extracted
          pwsh -File packaging/test-defaults.ps1 -Path publish/app-extracted
          sha256sum "dist/$name.tar.gz" | sed "s|dist/||" > "dist/$name.tar.gz.sha256"
          cli_name="Bunyi-CLI-${{ needs.version.outputs.version }}-${{ matrix.rid }}${{ matrix.suffix }}"
          chmod +x "publish/cli-${{ matrix.rid }}/bunyi"
          tar -czf "dist/$cli_name.tar.gz" -C "publish/cli-${{ matrix.rid }}" .
          sha256sum "dist/$cli_name.tar.gz" | sed "s|dist/||" > "dist/$cli_name.tar.gz.sha256"
          mkdir -p publish/cli-extracted
          tar -xzf "dist/$cli_name.tar.gz" -C publish/cli-extracted
          pwsh -File packaging/test-cli.ps1 -PublishDirectory publish/cli-extracted

      # A smoke check that the archive holds an app rather than an empty folder,
      # which a mistyped publish path would otherwise produce silently.
      - name: Check the archive
        if: matrix.rid == 'linux-x64'
        shell: bash
        working-directory: apps/dotnet
        run: |
          set -euo pipefail
          ls -l dist/
          # find, not ls: each job produces one of the two archive kinds, so a
          # glob for the other matches nothing and `ls` exits 2 for it. Under
          # set -e that took down the step on a perfectly good build — with
          # 2>/dev/null hiding the reason. find reports no matches as success,
          # and the emptiness check below is what should decide.
          archive="$(find dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)"
          test -n "$archive"
          # wc -c rather than stat, whose flags differ between the runners.
          size="$(wc -c < "$archive")"
          echo "$archive is $size bytes"
          # A self-contained Avalonia app is tens of megabytes. Anything near
          # empty means the publish wrote somewhere else and the archive would
          # ship as a folder of nothing.
          test "$size" -gt 20000000

      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'linux-x64'
        with:
          # The suffix is part of the name, or the two builds of a platform
          # would upload over each other and the release would ship one of
          # them twice.
          name: ${{ matrix.rid }}${{ matrix.suffix }}
          path: apps/dotnet/dist/*
          if-no-files-found: error

  windows-sign:
    needs: [version, build]
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    # Both flavors share one SimplySign session, avoiding concurrent OTP logins.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: windows-payload
          path: apps/dotnet/publish/cpu
      - uses: actions/download-artifact@v8
        with:
          name: windows-payload-cuda
          path: apps/dotnet/publish/cuda
      - name: Install Inno Setup
        shell: pwsh
        run: ./apps/dotnet/packaging/windows/install-inno.ps1 -Destination "$env:RUNNER_TEMP/inno"
      - name: Check signing configuration
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          foreach ($name in @('CERTUM_USERNAME', 'CERTUM_OTP_URI', 'CERTUM_KEY_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing signing secret: $name"
            }
          }
          if ($env:CERTUM_KEY_ID -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'CERTUM_KEY_ID must contain exactly 40 hexadecimal characters.'
          }
          # Never echo or include the provisioning URI in an exception.
          $uri = $null
          if (-not [Uri]::TryCreate($env:CERTUM_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
              $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
            throw 'CERTUM_OTP_URI must be the full otpauth://totp provisioning URI, not a one-time code or activation link.'
          }
      # Reviewed at this immutable revision. Diagnostic screenshots stay disabled.
      - name: Connect to Certum SimplySign
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ secrets.CERTUM_KEY_ID }}
          capture-diagnostics: 'false'
      - name: Sign, package and verify Windows releases
        shell: pwsh
        working-directory: apps/dotnet
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./packaging/windows/package-signed-release.ps1 -PublishRoot publish -OutputDirectory dist `
            -Version $env:RELEASE_VERSION -CompilerPath "$env:RUNNER_TEMP/inno/compiler/ISCC.exe"
      - name: Upload verified Windows downloads
        uses: actions/upload-artifact@v7
        with:
          name: windows-signed
          path: apps/dotnet/dist/*
          if-no-files-found: error

  linux-installers:
    needs: [version, build]
    uses: ./.github/workflows/linux-installer-check.yml
    with:
      artifact: linux-x64
      ref: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.tag || github.ref }}

  release:
    needs: [version, build, windows-sign, linux-installers]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          # Intermediate unsigned Windows payloads must never enter a release.
          pattern: linux-x64*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: windows-signed
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          version="${{ needs.version.outputs.version }}"
          notes="$(mktemp)"

          # Hand-written notes win when they exist, for the reason the macOS
          # workflow gives: merges squash, so a PR carrying a feature and five
          # fixes becomes one changelog line — accurate, and a poor description.
          handwritten="release-notes/$tag.md"
          {
            if [ -f "$handwritten" ]; then
              cat "$handwritten"
            else
              # apps/dotnet only, and deliberately NOT spec. Behaviour changes
              # start in /spec by this repository's own rule, so every macOS
              # feature touches it too — passing --path spec put fifteen
              # feat(macos) lines into this app's first release, describing work
              # the download does not contain.
              python3 tools/release-notes.py "$tag" \
                --tags 'dotnet-v*' --path apps/dotnet
            fi

            printf '\n---\n\n'
            printf '### Installing\n\n'
            printf '**Windows** — run `Bunyi-%s-win-x64-setup.exe`, then open Bunyi from Start.\n' "$version"
            printf '**Windows with NVIDIA acceleration** — use `Bunyi-%s-win-x64-cuda-setup.exe`. It replaces the standard edition and retains your data; run the standard installer to switch back. Compatible CUDA and cuDNN libraries must be installed separately.\n' "$version"
            printf '**Ubuntu/Debian** — install `bunyi_%s_amd64.deb` with your package installer.\n' "$version"
            printf '**Fedora** — install `bunyi-%s-1.x86_64.rpm` with your package installer.\n' "$version"
            printf 'Linux packages add Bunyi to your application menu and install native dependencies.\n\n'
            printf 'Upgrades and uninstall retain your models, voices, recordings and settings. '
            printf 'Close Bunyi before upgrading. Download a newer installer to update the app.\n\n'
            printf '**Portable alternatives** — unzip the Windows ZIP and run `Bunyi.App.exe`, '
            printf 'or extract the Linux tarball and run `./Bunyi.App`.\n\n'
            printf '**CLI for agents and terminals** — use the separate `Bunyi-CLI-` '
            printf 'archive for your OS, extract the entire folder, and run `bunyi --help` '
            printf '(Windows: `bunyi.exe --help`). Add that folder to PATH if desired. '
            printf 'No desktop session or .NET installation is required. '
            printf 'See [the CLI guide](https://github.com/shaztechio/bunyi-app/blob/%s/apps/dotnet/CLI.md) ' "$tag"
            printf 'for one-shot generation, the resident server, and download progress.\n\n'
            printf 'Self-contained: there is no .NET runtime to install. Models download through Bunyi after installation.\n\n'
            printf 'The **-cuda** downloads are the same app built against ONNX Runtime '
            printf 'with its GPU package, measured 1.7x faster on long text. Take one '
            printf 'only if you have an NVIDIA card **and** the NVIDIA CUDA Toolkit '
            printf 'installed: the provider links against cuBLAS and cudart, which are '
            printf 'not shipped here. If CUDA cannot load, the app falls back to the '
            printf 'CPU, says so in the log, and generates normally. Everyone else '
            printf 'wants the plain download.\n\n'
            printf '### Code signing policy\n\n'
            printf '**Windows** — app/CLI binaries and installers are Authenticode-signed '
            printf 'with a Certum certificate and timestamped. The publisher is '
            printf '*Shazron Elhazar Abdullah*. SmartScreen may still warn on new downloads; '
            printf 'check the publisher under *More info*. SHA-256 checksums are below.\n\n'
            printf '**Linux** — DEB, RPM and portable downloads are unsigned. Verify them against '
            printf 'the SHA-256 checksums published below.\n\n'
            printf '**macOS** is a separate download, signed with an Apple Developer ID '
            printf 'certificate and notarized by Apple.\n\n'
            printf '**Team roles** — committers, reviewers and approvers: '
            printf 'Shazron Abdullah ([@shazron](https://github.com/shazron)).\n\n'
            printf 'This program does not transfer any information to other networked '
            printf 'systems unless you ask it to: models are downloaded when you first use '
            printf 'a mode, and nothing else leaves your machine.\n\n'
            printf '### What works\n\n'
            printf 'All three modes — preset voice, voice design and voice clone — plus '
            printf 'saved voices, history, and backup and restore.\n\n'
            printf 'The first generation in each mode downloads the model for that mode '
            printf '(3.9–5.9 GB) with a progress bar and a time estimate; after that it '
            printf 'runs offline. Doctor checks there is room before the download starts.\n\n'
            printf '### Requirements\n\n'
            printf 'A 64-bit Windows or Linux machine. Generation runs on the CPU unless '
            printf 'you took a -cuda download and have the toolkit for it; long text can '
            printf 'reach about 7 GB of memory on preset voice, so 8 GB is tight and '
            printf '16 GB is comfortable.\n\n'
            printf 'SHA-256:\n\n```\n'
            cat dist/*.sha256
            printf '```\n'
          } > "$notes"

          gh release create "$tag" dist/* \
            --title "Bunyi for Windows and Linux $version" \
            --notes-file "$notes" \
            --verify-tag

  refresh-site:
    name: Refresh website
    needs: [version, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Dispatch explicitly: GITHUB_TOKEN can start workflow_dispatch runs,
      # and main keeps Pages within its existing deployment branch policy.
      # Signing dry runs must not publish a release or deploy the website.
      - name: Queue the website build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main --repo "$RELEASE_REPOSITORY"
