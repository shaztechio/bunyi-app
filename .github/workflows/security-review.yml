# Copy to .github/workflows/security-review.yml in any repo you want reviewed.
# Needs repo secrets ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY (only for the
# providers you use) and Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests".

name: Security review

on:
  workflow_dispatch:
    inputs:
      anthropic:
        description: "Anthropic (Claude Code)"
        type: boolean
        default: true
      openai:
        description: "OpenAI (Codex)"
        type: boolean
        default: true
      gemini:
        description: "Google (Gemini CLI)"
        type: boolean
        default: false
      gemini-model:
        description: "Gemini model (blank = CLI default)"
        type: string
        default: "gemini-3.1-pro-preview"
      draft:
        description: "Open PRs as drafts"
        type: boolean
        default: true
      upload-sarif:
        description: "Upload findings to code scanning (Security tab)"
        type: boolean
        default: true

jobs:
  security-review:
    permissions:
      contents: write
      pull-requests: write
      security-events: write # code scanning upload
      actions: read          # needed by the SARIF upload on private repos
    uses: shaztechio/multi-llm-security-review/.github/workflows/security-review.yml@main
    with:
      anthropic: ${{ inputs.anthropic }}
      openai: ${{ inputs.openai }}
      gemini: ${{ inputs.gemini }}
      gemini-model: ${{ inputs.gemini-model }}
      draft: ${{ inputs.draft }}
      upload-sarif: ${{ inputs.upload-sarif }}
      # claude-model: claude-sonnet-4-6
      # tool-ref: main   # keep in step with the @ref on the uses: line
    secrets: inherit
