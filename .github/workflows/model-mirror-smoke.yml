name: Model mirror smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-mirror-smoke
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Download through Bunyi.Core from the production mirror
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project apps/dotnet/tools/MirrorSmoke -c Release 2>&1 | tee mirror-smoke.log
      - name: Preserve download diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mirror-smoke-log
          path: mirror-smoke.log
          if-no-files-found: warn
          retention-days: 14
