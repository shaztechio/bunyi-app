# Prototype: run Google's Gemini CLI security extension over the repo.
# The multi-LLM review's Gemini agent is refused by the model ("safety guidelines prohibit
# vulnerability scanning of concrete targets"); this checks whether Google's own extension
# prompts get past that. Manual trigger only; output goes to the job summary and an artifact.
name: Gemini security extension (prototype)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to analyze, in plain words (the extension takes natural language)"
        type: string
        default: "all source code in the repository, not just the diff; skip docs and lockfiles"
      model:
        description: "Gemini model (blank = CLI default)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gemini CLI and the security extension
        run: |
          npm install -g @google/gemini-cli
          gemini extensions install https://github.com/gemini-cli-extensions/security --consent

      - name: Run /security:analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCOPE: ${{ inputs.scope }}
          MODEL: ${{ inputs.model }}
        shell: bash
        run: |
          # The extension reads its own files from ~/.gemini/extensions; tools are otherwise
          # limited to the workspace, so allow that directory too.
          args=(-p "/security:analyze ${SCOPE} Return the report in JSON format." --skip-trust
                --include-directories "$HOME/.gemini/extensions/gemini-cli-security")
          [[ -n "$MODEL" ]] && args+=(--model "$MODEL")
          gemini "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/gemini-security.txt"
          { echo '## Gemini security extension output'; echo '```'; head -c 60000 "$RUNNER_TEMP/gemini-security.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-security-extension-output
          path: ${{ runner.temp }}/gemini-security.txt
          retention-days: 14
