name: Website

on:
  push:
    branches: [main]
    paths: ['README.md', 'docs/**', 'tools/build_site.py', 'tools/test_build_site.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['README.md', 'docs/**', 'tools/build_site.py', 'tools/test_build_site.py', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Queue release refresh on main
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # A release event uses its tag ref; the Pages environment allows main.
      # Dispatch on main instead of widening that deployment restriction.
      - name: Refresh the website
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main --repo "$RELEASE_REPOSITORY"

  build:
    name: Build website
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # A release tag can predate later site work. Always publish the main
          # website, never source or artifacts supplied by the triggering run.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          persist-credentials: false
      - name: Test release selection and rendering
        run: python3 -m unittest discover -s tools -p 'test_build_site.py' -v
      - name: Read published releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: gh api --paginate --slurp "repos/$RELEASE_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/site-releases.json"
      - name: Render release references
        run: python3 tools/build_site.py --releases-json "$RUNNER_TEMP/site-releases.json" --output _site --readme README.md
      - name: Save the release snapshot for README sync
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release-snapshot
          path: ${{ runner.temp }}/site-releases.json
          retention-days: 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  readme:
    name: Sync README release downloads
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-snapshot
          path: ${{ runner.temp }}/release-snapshot
      # Use the site's exact release snapshot, but preserve current main prose.
      - name: Update README downloads
        run: python3 tools/build_site.py --releases-json "$RUNNER_TEMP/release-snapshot/site-releases.json" --readme README.md
      # All repository changes go through a PR. Reuse one branch while a
      # previous refresh is awaiting review; unchanged versions are a no-op.
      - name: Open or update the README sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: codex/sync-readme-downloads
          base: main
          add-paths: README.md
          sign-commits: true
          commit-message: 'docs: sync README downloads with published releases'
          title: 'docs: sync README downloads with published releases'
          body: |
            Update the README download versions and links from the same complete
            stable release snapshot used to build GitHub Pages.

            Only the marked downloads block changes. macOS and Windows/Linux
            versions are selected independently; incomplete uploads and
            prereleases are excluded.

            Approve the pull request's workflow runs if GitHub requests it,
            then merge after the checks pass.

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
